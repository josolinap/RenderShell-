[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

# 1. Tailscale daemon (userspace networking — no /dev/net/tun needed)
[program:tailscaled]
command=/usr/local/bin/tailscaled --state=mem: --socket=/var/run/tailscale/tailscaled.sock --tun=userspace-networking
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=10

# 2. Register with Tailscale as an exit node using the authkey
#    --advertise-exit-node: makes this node available as an exit node
#    --accept-routes: accepts subnet routes advertised by other nodes
#    --reset: clears any stale local config
#    Runs once at startup; autorestart=false so it doesn't loop
[program:tailscale-up]
command=/bin/sh -c 'sleep 3 && tailscale up --auth-key="${TAILSCALE_AUTHKEY}" --advertise-exit-node --accept-routes --reset --hostname="${TAILSCALE_HOSTNAME:-render-exit-node}"'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
startretries=2
priority=20

# 3. Shellinabox web terminal
#    --disable-ssl: Tailscale terminates TLS; no double-SSL
#    --no-beep: no terminal beeps
#    -s /:LOGIN: standard login prompt (user enters root + ROOT_PASSWORD)
#    -p 4200: listen on port 4200 (Tailnet-only, not exposed to Render)
#    --css: optional dark theme
[program:shellinabox]
command=/usr/bin/shellinaboxd --disable-ssl --no-beep -s /:LOGIN -p 4200 --css=/etc/shellinabox/options-enabled/00+Black-on-White.css
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=30

# 4. HTTP status page on Render's required port
#    Render routes HTTPS traffic to whatever port is in $PORT (default 8080).
#    This serves /workspace/index.html so the Render URL shows something.
[program:http-server]
command=python3 -m http.server 8080 --bind 0.0.0.0 --directory /workspace
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=40

# 5. Expose shellinabox via Tailscale Serve (HTTPS on the Tailnet)
#    Userspace networking doesn't expose ports directly to the Tailnet,
#    so we use `tailscale serve` to proxy HTTPS -> shellinabox on 4200.
#    Access at: https://render-shell.<tailnet>.ts.net/
#    Runs after tailscale-up has registered (priority 50, with sleep)
[program:tailscale-serve]
command=/bin/sh -c 'sleep 15 && tailscale serve --bg 4200'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
startretries=5
priority=50
